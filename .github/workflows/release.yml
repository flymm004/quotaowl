name: Draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\build.ps1 -Version $version
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            "artifacts/QuotaOwl-$version-win-x64.zip",
            "artifacts/QuotaOwl-$version-win-x64.zip.sha256",
            "artifacts/release/QuotaOwl-$version-win-x64.exe",
            "artifacts/release/QuotaOwl-$version-win-x64.exe.config",
            "artifacts/release/QuotaOwl-$version-win-x64.exe.sha256"
          )
          $notesPath = "docs/release-notes-$version.md"
          if (Test-Path -LiteralPath $notesPath) {
            & gh release create $env:GITHUB_REF_NAME @assets --draft --prerelease --title "QuotaOwl $version" --notes-file $notesPath
          } else {
            & gh release create $env:GITHUB_REF_NAME @assets --draft --prerelease --title "QuotaOwl $version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create draft release." }
