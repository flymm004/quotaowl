name: Bug report
description: Report a reproducible problem with QuotaOwl.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please remove account emails, authentication data, and live quota values from screenshots and logs."
  - type: input
    id: app
    attributes:
      label: QuotaOwl version
      placeholder: 0.2.0-alpha.4
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options: [Codex, Claude, Both, UI / tray]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version (if relevant)
      placeholder: codex --version
    validations:
      required: false
  - type: input
    id: claude
    attributes:
      label: Claude Code version (if relevant)
      placeholder: claude --version
  - type: input
    id: scaling
    attributes:
      label: Display scaling
      placeholder: 100%, 150%, 200%
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
